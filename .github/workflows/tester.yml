name: Tester

on:
  push:
  pull_request:

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer avhengigheter
        run: pip install paho-mqtt pyflakes
      - name: Sjekk koden (pyflakes)
        run: python -m pyflakes xcomfort_bridge/*.py xcomfort_bridge/tests/*.py
      - name: Kjør tester
        run: cd xcomfort_bridge && python -m unittest discover -s tests -v
