configuration:
  xcomfort_ip:
    name: Home Manager IP
    description: "Required. Local IP address of the xComfort Home Manager, e.g. 192.168.1.50. Give the Home Manager a fixed address in your router."
  xcomfort_port:
    name: Home Manager port
    description: Almost never needs to be changed.
  mqtt_host:
    name: MQTT broker
    description: "core-mosquitto is correct if you use the Mosquitto broker app."
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT username
    description: "Required. A Home Assistant user (e.g. a separate user called xcomfort) that the app logs in to Mosquitto with."
  mqtt_password:
    name: MQTT password
    description: The password for the MQTT user above.
  log_level:
    name: Log level
    description: "info is normal. debug logs EVERYTHING sent to and from the Home Manager (use when troubleshooting)."
  poll_interval:
    name: Poll interval (seconds)
    description: How often everything is read when instant status is off.
  light_control:
    name: Light control
    description: "hybrid = the USB stick first, and the Home Manager when there is no stick or a dimmer does not answer (recommended, and completely safe without a stick). Batches to more than 6 dimmers go straight through the Home Manager, because it is faster. usb_stick = the USB stick only, no fallback. home_manager = the Home Manager only. Lights without dimmers in the USB map always use the Home Manager, and so do switches, thermostats and awnings."
  instant_status:
    name: Instant status
    description: Keeps a connection open to the Home Manager and receives changes right away (under 1 second) instead of waiting for the next poll. Required for wall buttons. Only turn off when troubleshooting.
  switches_as_lights:
    name: On/off switches as lights too
    description: Also creates a light entity for the on/off switches that are lights (for example ceiling lights), so they show up under Lights in Home Assistant and Google Home. The switch entities are kept.
  awning_position:
    name: Awning position (time based)
    description: Calculates an approximate position (0-100 %) from the running time, and lets Home Assistant set a position directly. Applies to all awnings. Awnings you add on the web page get their running time there.
  awning_runtime_balcony:
    name: Running time, balcony awning (seconds)
    description: Time from fully retracted to fully extended. The three running times are for the awnings built into the code. Awnings you add on the web page get their running time there.
  awning_runtime_pavilion:
    name: Running time, pavilion awning (seconds)
  awning_runtime_hot_tub:
    name: Running time, hot tub awning (seconds)
  awning_command_gap:
    name: Pause between awning commands (seconds)
    description: Minimum time between two radio telegrams to the awnings, so they do not collide.
  awning_double_stop:
    name: Send "stop" twice
    description: Sends stop once more after 0.8 seconds. Always safe, and helps if the first telegram did not arrive.
  awning_repeat_move:
    name: Repeat "extend" and "retract" once (test first)
    description: Sends extend or retract once more after 1.5 seconds. Only turn on after testing that an extra command does not stop your motor.
