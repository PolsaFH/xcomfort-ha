name: "xComfort MQTT-bro"
version: "2.0.1"
slug: "xcomfort_bridge"
description: "Kobler xComfort-anlegget til Home Assistant via MQTT (lokalt, uten sky)"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
init: false
# Helsesjekk: broen svarer paa http://<app>:8099/health (bare internt i HA,
# porten aapnes ikke mot nettverket ditt). Slaa paa "Watchdog" i appens
# Info-fane, saa starter Supervisor broen paa nytt hvis den krasjer/henger.
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  xcomfort_ip: "192.168.50.169"
  xcomfort_port: 10023
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: "xcomfort"
  mqtt_password: ""
  log_level: "info"
  poll_interval: 20
  markise_posisjon: true
  markise_kjoretid_balkong: 20
  markise_kjoretid_paviljong: 34
  markise_kjoretid_boblebad: 25
  markise_pause_mellom_kommandoer: 0.5
  markise_dobbel_stopp: true
  markise_gjenta_bevegelse: false
schema:
  xcomfort_ip: str
  xcomfort_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  log_level: list(debug|info|warning)
  poll_interval: int(5,300)
  markise_posisjon: bool
  markise_kjoretid_balkong: float(1,120)
  markise_kjoretid_paviljong: float(1,120)
  markise_kjoretid_boblebad: float(1,120)
  markise_pause_mellom_kommandoer: float(0,5)
  markise_dobbel_stopp: bool
  markise_gjenta_bevegelse: bool
