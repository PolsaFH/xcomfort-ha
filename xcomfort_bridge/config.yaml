name: "xComfort MQTT Bridge"
version: "3.1.2"
slug: "xcomfort_bridge"
url: "https://github.com/PolsaFH/xcomfort-ha"
description: "Local control of Eaton xComfort / Sensio through the Home Manager. No cloud. Optional USB stick for instant light control."
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
init: false
# Health check: the bridge answers on http://<app>:8099/health (internal to HA
# only, the port is not opened to your network). Turn on "Watchdog" on the
# app's Info tab and the Supervisor restarts the bridge if it crashes or hangs.
watchdog: "http://[HOST]:[PORT:8099]/health"
# The app's own web page in the HA sidebar.
# USB: gives the app access to the xComfort USB stick CKOZ-00/13 (optional).
usb: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-group
panel_title: xComfort
options:
  xcomfort_ip: ""
  xcomfort_port: 10023
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: "info"
  poll_interval: 20
  light_control: hybrid
  instant_status: true
  switches_as_lights: false
  awning_position: true
  awning_runtime_balcony: 20
  awning_runtime_pavilion: 34
  awning_runtime_hot_tub: 25
  awning_command_gap: 0.5
  awning_double_stop: true
  awning_repeat_move: false
schema:
  xcomfort_ip: str
  xcomfort_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  log_level: list(debug|info|warning)
  poll_interval: int(5,300)
  light_control: list(hybrid|usb_stick|home_manager)
  instant_status: bool
  switches_as_lights: bool
  awning_position: bool
  awning_runtime_balcony: float(1,120)
  awning_runtime_pavilion: float(1,120)
  awning_runtime_hot_tub: float(1,120)
  awning_command_gap: float(0,5)
  awning_double_stop: bool
  awning_repeat_move: bool
